services:
  # OCR como servicio web gratuito (los servicios privados no admiten plan free)
  - type: web
    name: etiquetas-ocr
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./ocr-service/Dockerfile
    dockerContext: ./ocr-service
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: etiquetas-backend
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m
      - key: DATABASE_URL
        fromDatabase:
          name: etiquetas-db
          property: connectionString
      - key: OCR_HOSTPORT
        fromService:
          type: web
          name: etiquetas-ocr
          property: hostport

  - type: web
    name: etiquetas-frontend
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: etiquetas-backend
          property: hostport

databases:
  - name: etiquetas-db
    region: virginia
    plan: free
    databaseName: etiquetas
    user: etiquetas