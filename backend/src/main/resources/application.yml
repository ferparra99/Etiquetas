server:
  port: ${PORT:8080}

spring:
  application:
    name: etiquetas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/etiquetas}
    username: ${DB_USER:etiquetas}
    password: ${DB_PASSWORD:etiquetas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ocr:
  base-url: ${OCR_BASE_URL:http://${OCR_HOSTPORT:localhost:8000}}
  connect-timeout-seconds: 5
  read-timeout-seconds: 60
