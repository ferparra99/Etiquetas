services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etiquetas}
      POSTGRES_USER: ${POSTGRES_USER:-etiquetas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etiquetas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etiquetas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ocr:
    build: ./ocr-service
    ports:
      - "8000:8000"
    environment:
      OCR_DET_MODEL: ${OCR_DET_MODEL:-PP-OCRv5_mobile_det}
      OCR_REC_MODEL: ${OCR_REC_MODEL:-PP-OCRv5_mobile_rec}
      OCR_DOC_ORIENTATION: ${OCR_DOC_ORIENTATION:-false}
      OCR_DOC_UNWARPING: ${OCR_DOC_UNWARPING:-false}
      OCR_TEXTLINE_ORIENTATION: ${OCR_TEXTLINE_ORIENTATION:-true}
      OCR_DET_LIMIT_SIDE_LEN: ${OCR_DET_LIMIT_SIDE_LEN:-}
      OCR_DET_LIMIT_TYPE: ${OCR_DET_LIMIT_TYPE:-}
      OCR_DET_THRESH: ${OCR_DET_THRESH:-}
      OCR_DET_BOX_THRESH: ${OCR_DET_BOX_THRESH:-}
      OCR_DET_UNCLIP_RATIO: ${OCR_DET_UNCLIP_RATIO:-}
      OCR_REC_SCORE_THRESH: ${OCR_REC_SCORE_THRESH:-}
    volumes:
      - paddlex-cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-etiquetas}
      DB_USER: ${POSTGRES_USER:-etiquetas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-etiquetas}
      OCR_BASE_URL: http://ocr:8000
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  paddlex-cache:
